name: Build IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App (No Code Signing)
        run: |
          xcodebuild clean build \
            -project "brokenithm-swiftui.xcodeproj" \
            -scheme "brokenithm-swiftui" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          # Create the Payload directory needed for an IPA
          mkdir -p Payload
          
          # Move the compiled .app into the Payload folder
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          
          # Zip it up into an .ipa file
          zip -r brokenithm-swiftui.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          path: brokenithm-swiftui.ipa
          archive: false